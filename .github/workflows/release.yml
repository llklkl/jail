name: Release packages

# 仅在推送 v 前缀 tag 时触发；master 推送不会运行任何任务。
# 手动测试方法：git tag v0.0.0-test && git push origin v0.0.0-test（测完可删）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 同 CPU 架构只编译一次：产物与桌面集成 payload（usr/ 树）打包后供
  # deb / rpm 各发行版任务复用，各打包 job 不再重复编译。
  # 构建机选 ubuntu-24.04（glibc 2.39）：目标发行版 glibc 必须 >= 构建机
  # （Fedora 44/45 满足）；未来加入更老 glibc 的目标时需为其单独构建。
  build:
    name: Build (release, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Derive arch
        run: echo "ARCH_RAW=$(uname -m)" >> "$GITHUB_ENV"

      - name: Install build deps
        run: |
          sudo apt-get update
          # libclang-dev：rustables 的 bindgen 构建脚本依赖 libclang
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libclang-dev

      - name: Build (release, locked)
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo build --release --locked

      - name: Stage payload (usr/ tree)
        run: |
          PKG=pkg
          mkdir -p "$PKG/usr/bin"
          cp target/release/jail "$PKG/usr/bin/jail"
          # 借用应用自身的桌面集成逻辑产出 desktop 文件与图标集；
          # XDG_DATA_HOME 指向暂存目录，不污染 runner 的用户目录。
          XDG_DATA_HOME="$PWD/$PKG/usr/share" ./target/release/jail --install-desktop
          # 安装到系统路径后，Exec/TryExec 统一指向 /usr/bin/jail
          sed -i -e 's|^Exec=.*|Exec=/usr/bin/jail|' -e 's|^TryExec=.*|TryExec=/usr/bin/jail|' \
            "$PKG/usr/share/applications/top.llklkl.jail.desktop"
          # desktop-file-utils 存在时 update-desktop-database 会生成此文件，
          # 未在包清单声明，统一剔除以保证 payload 与 runner 工具链无关
          rm -f "$PKG/usr/share/applications/mimeinfo.cache"
          find "$PKG" -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ env.ARCH_RAW }}
          path: pkg

  deb:
    name: Build DEB (Ubuntu 24.04)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Derive version / distro / arch from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER//-/~}" # 0.1.0-rc1 -> 0.1.0~rc1（deb 预发布排序语义）
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag 必须形如 v1.2.3 或 v1.2.3-rc1，当前: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "ARCH=$(uname -m | sed -e 's/^x86_64$/amd64/' -e 's/^aarch64$/arm64/')" >> "$GITHUB_ENV"
          echo "ARCH_RAW=$(uname -m)" >> "$GITHUB_ENV"
          # 发行版代号（Ubuntu 24.04 -> noble），随 runner 镜像版本自动跟进
          echo "DISTRO=$(. /etc/os-release && echo "${VERSION_CODENAME:-noble}")" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ env.ARCH_RAW }}
          path: pkg

      - name: Build DEB
        run: |
          # artifact 传输可能丢失可执行位，显式恢复
          chmod 755 pkg/usr/bin/jail
          mkdir -p pkg/DEBIAN
          sed -e "s/@VERSION@/$VER/" -e "s/@ARCH@/$ARCH/" packaging/deb.control > pkg/DEBIAN/control
          # 包名格式：jail_<版本>_<发行版本名称>_<cpu架构>.deb
          dpkg-deb --build --root-owner-group pkg "jail_${VER}_${DISTRO}_${ARCH}.deb"
          dpkg-deb --info "jail_${VER}_${DISTRO}_${ARCH}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ env.DISTRO }}
          path: jail_*.deb

  rpm:
    name: Build RPM (Fedora ${{ matrix.fedora_version }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 受支持的 Fedora 发布版；新增版本在此追加
        fedora_version: [44, 45]
    container:
      image: fedora:${{ matrix.fedora_version }}
    steps:
      # 只打包不编译：仅需 git（checkout）、tar 与 rpm-build
      - name: Install packaging tools
        run: dnf install -y git tar rpm-build

      - uses: actions/checkout@v4

      - name: Derive version / arch from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VER="${VER//-/~}" # rpm Version 不允许连字符，~ 表示预发布
          case "$VER" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag 必须形如 v1.2.3 或 v1.2.3-rc1，当前: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "ARCH_RAW=$(uname -m)" >> "$GITHUB_ENV"
          echo "FC=${{ matrix.fedora_version }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: payload-${{ env.ARCH_RAW }}
          path: pkg

      - name: Build RPM
        run: |
          # artifact 传输可能丢失可执行位，显式恢复
          chmod 755 pkg/usr/bin/jail
          TOP="$HOME/rpmbuild"
          mkdir -p "$TOP"/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          tar -C pkg -czf "$TOP/SOURCES/jail-$VER-payload.tar.gz" usr
          # dist 宏注入 Release: 1.fc44 / 1.fc45，产物文件名按发行版区分
          rpmbuild -bb \
            --define "pkgver $VER" \
            --define "dist .fc$FC" \
            --define "_topdir $TOP" \
            packaging/jail.spec
          find "$TOP/RPMS" -name '*.rpm' -exec cp {} . \;
          ls -la *.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fc${{ matrix.fedora_version }}
          path: jail-*.rpm

  release:
    name: Publish GitHub Release
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist/
          EXTRA=()
          case "$TAG" in *-*) EXTRA+=(--prerelease) ;; esac # v1.2.3-rc1 等
          gh release create "$TAG" --title "$TAG" --generate-notes "${EXTRA[@]}" dist/*
          gh release view "$TAG"
