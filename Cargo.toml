[package]
name = "jail"
version = "0.1.0"
edition = "2021"
description = "top.llklkl.jail — Linux app launcher with per-app network sandboxing (MD3 UI)"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
freedesktop-desktop-entry = "0.7"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
rustables = "0.9"
libc = "0.2"
ksni = { version = "0.3", features = ["blocking"] }
signal-hook = "0.4"

[profile.release]
lto = "thin"
strip = true
